[uwsgi]
uid = indico
gid = indico
pidfile = /tmp/uwsgi.pid

processes = 4
enable-threads = true
py-call-uwsgi-fork-hooks = true

socket = /tmp/uwsgi.sock
protocol = uwsgi

http-socket = 127.0.0.1:4321

master = true
auto-procname = true
procname-prefix-spaced = indico
disable-logging = true

;plugin = python
single-interpreter = true

touch-reload = /opt/indico/indico.wsgi
wsgi-file = /opt/indico/indico.wsgi
virtualenv = /opt/indico/.venv

ignore-sigpipe = true
ignore-write-errors = true
disable-write-exception = true

vacuum = true
memory-report = true
max-requests = 2500
harakiri = 900
harakiri-verbose = true
post-buffering = 8192
reload-on-rss = 2048
evil-reload-on-rss = 8192

offload-threads = 4

static-map = /css=/opt/indico/static/css
static-map = /dist=/opt/indico/static/dist
static-map = /images=/opt/indico/static/images
static-map = /fonts=/opt/indico/static/fonts
static-map = /robots.txt=/opt/indico/static/robots.txt